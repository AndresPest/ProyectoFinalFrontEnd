<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <img src="assets/logoUCAB.png" alt="UCAB" class="auth-logo">
      <h2>¡Hola de nuevo!</h2>
      <p>Ingresa a tu cuenta para continuar</p>
    </div>

    <form class="auth-form" (ngSubmit)="iniciarSesion()">
      <div class="input-group">
        <label>Correo o Usuario</label>
        <div class="input-wrapper">
          <i class="ph ph-user-circle"></i>
          <input type="text" placeholder="usuario@est.ucab.edu.ve" [(ngModel)]="usuario" name="usuario"/>
        </div>
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <i class="ph ph-key"></i>
          <input type="password" placeholder="••••••••" [(ngModel)]="password" name="password"/>
        </div>
        <div class="forgot-pass">
          <span (click)="irA('login')">¿Olvidaste tu contraseña?</span>
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="form.invalid">Entrar</button>

      <p class="auth-footer">
        ¿Aún no tienes cuenta? <span (click)="irA('registro')">Regístrate aquí</span>
      </p>
    </form>
  </div>
</div>
