<app-navbar></app-navbar>
<router-outlet></router-outlet>

<div class="auth-container" [@fadeIn]>
  <div class="auth-card">
    <div class="main-header">
      <img src="assets/logoUCAB.png" alt="UCAB" class="auth-logo">
      <h1>¡Bienvenido!</h1>
      <p>Ingresa a tu cuenta para continuar</p>
    </div>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="iniciarSesion()">
      
      <div class="input-group">
        <label>Correo electrónico</label>
        <div class="input-wrapper">
          <i class="ph ph-user-circle"></i>
          <input type="email" placeholder="usuario@est.ucab.edu.ve" formControlName="usuario"/>
        </div>
      </div>

      <div class="input-group">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <i class="ph ph-key"></i>
          <input type="password" placeholder="••••••••" formControlName="password"/>
        </div>
        <div class="forgot-pass">
          <span (click)="irA('login')">¿Olvidaste tu contraseña?</span>
        </div>
      </div>

      @if (errorMessage()) {
        <p style="color: red; font-size: 0.8rem; text-align: center; margin-bottom: 10px;">{{ errorMessage() }}</p>
      }

      <button type="submit" class="btn-submit" [disabled]="form.invalid || cargando()">
        {{ cargando() ? 'Cargando...' : 'Entrar' }}
      </button>

      <p class="auth-footer">
        ¿Aún no tienes cuenta? <span (click)="irA('registro')">Regístrate aquí</span>
      </p>
    </form>
  </div>
</div>
